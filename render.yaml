services:
  - type: web
    name: comparador-imoveis-bh
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # troque para "standard" se precisar de mais recursos
    region: ohio           # ou "frankfurt" se preferir latência menor para BR

    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      # Proxy residencial para contornar bloqueio Cloudflare do VivaReal/ZAP
      # Formato: http://usuario:senha@host:porta
      # Deixe vazio para desativar (scraping local funciona sem proxy)
      - key: PROXY_URL
        value: "http://ilegtyfg:pekuos5xgpma@31.59.20.176:6754"

    healthCheckPath: /
